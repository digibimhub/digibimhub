name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RESEND_API_KEY: re_ci_dummy_not_a_real_key
      CONTACT_TO_EMAIL: info@digibimhub.com
      CONTACT_FROM_EMAIL: info@digibimhub.com
      DOWNLOAD_REGISTRY: '{"products":[]}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify env contract
        run: node scripts/check-env-contract.mjs

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
