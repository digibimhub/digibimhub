name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block tracked env files
        run: |
          set -euo pipefail
          tracked="$(git ls-files '.env' '.env.local' '.env.*.local' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env files must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan diff for Resend-style keys
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" | grep -E 're_[a-zA-Z0-9]{20,}'; then
            echo "::error::Possible Resend API key detected in PR diff."
            exit 1
          fi
          echo "No Resend-style keys in PR diff."
